# Exp-0 / T1: rap_v2_official_agent.yaml plus a test-time camera-rig change.
# RIG_PRESET names an entry of rap_eval_agents.rig_transform.PRESETS ("raw" = unchanged input).
# Default RIG_UNDISTORT=0 keeps the lens (distorted images, as in training); 1 switches every
# preset to undistorted pinhole images. The "undistort_only" preset always undistorts.
_target_: rap_eval_agents.rap_v2_rig_agent.RAPV2RigAgent
_convert_: 'all'
rap_root: ${oc.env:RAP_ROOT,/gs/bs/tga-RLA/qdeng/RAP}
checkpoint_path: ${oc.env:RAP_CKPT}
dino_ckpt_path: ${oc.env:RAP_DINO_CKPT,/gs/bs/tga-RLA/qdeng/RAP/ckpts/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth}
model_time_horizon: 5.0
load_backbone: false
selector: ${oc.env:RAP_SELECTOR,scorer}
rig_preset: ${oc.env:RIG_PRESET,raw}
undistort: ${oc.env:RIG_UNDISTORT,0}
trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
