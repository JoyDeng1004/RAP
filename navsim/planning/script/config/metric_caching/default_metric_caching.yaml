hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra  # Hydra configuration output.
  searchpath:  # Package configuration search paths.
    - pkg://navsim.planning.script.config.common
    - pkg://navsim.planning.script.config.training 
    - pkg://navsim.planning.script.config.pdm_scoring 
  job:
    chdir: False

defaults:
  - default_common
  - _self_
  - default_evaluation
  - default_scoring_parameters
  - agent: constant_velocity_agent
  - train_val_test_log_split: nuplan_trainval


cache:
  cache_path: ${oc.env:NAVSIM_EXP_ROOT}/metric_cache
  use_cache_without_dataset: false
  force_feature_computation: false

output_dir: ${cache.cache_path}/metadata
navsim_log_path: ${oc.env:OPENSCENE_DATA_ROOT}/navsim_logs/${train_test_split.data_split}
