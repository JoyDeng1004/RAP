hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra  # Hydra configuration output.
  searchpath:  # Package configuration search paths.
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - train_val_test_log_split: nuplan_trainval
  - agent: ego_status_mlp_agent
  - dataset: waymo_dataset
  - _self_

split: trainval
waymo_raw_path: null
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache
cache_path_perturbed: ${oc.env:NAVSIM_EXP_ROOT}/training_cache_perturbed
cache_path_others: ${oc.env:NAVSIM_EXP_ROOT}/training_cache_others
use_cache_without_dataset: false  # Load cached samples and ignore scene filters.
force_cache_computation: true
# Few-shot: intersect the cached training logs with train_logs instead of using
# the whole cache. The K-shot splits generated by tools/make_kshot_splits.py set
# this to true themselves.
restrict_train_logs: false
seed: 0
index: 0

dataloader:
  params:
    batch_size: 64
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    drop_last: False

trainer:
  params:
    max_epochs: 100
    check_val_every_n_epoch: 1
    val_check_interval: 1.0

    limit_train_batches: 1.0  # Fraction or number of training batches.
    limit_val_batches: 1.0  # Fraction or number of validation batches.

    accelerator: gpu
    strategy: ddp_find_unused_parameters_true
    precision: 16-mixed
    num_nodes: 1

    num_sanity_val_steps: 2
    fast_dev_run: false  # Run one batch for each stage.

    accumulate_grad_batches: 1
    gradient_clip_val: 0.0
    gradient_clip_algorithm: norm  # Gradient clipping mode: value or norm.
    default_root_dir: ${output_dir}
